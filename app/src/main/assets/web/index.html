<header class="bar">
  <a class="brand" href="#/"><img src="/.yawts/favicon.svg" alt="" width="28" height="28"><span id="brandName">{{NAME}}</span></a>
  <input id="search" class="search" type="search" hidden>
  <button id="themeBtn" class="btn icon" type="button"><svg class="i"><use href="#i-theme-auto"/></svg></button>
  <button id="logoutBtn" class="btn icon" type="button" hidden><svg class="i"><use href="#i-logout"/></svg></button>
</header>

<main>
  <form id="loginView" class="card login" hidden>
    <img src="/.yawts/favicon.svg" alt="" width="64" height="64" class="login-logo">
    <h1>{{NAME}}</h1>
    <p data-t="loginPrompt"></p>
    <input id="password" type="password" autocomplete="current-password" required>
    <p id="loginError" class="error" data-t="loginError" hidden></p>
    <button class="btn primary" data-t="login"></button>
  </form>

  <section id="browseView" hidden>
    <nav id="crumbs" class="crumbs"></nav>

    <!-- Stays at the top while the list scrolls under it. -->
    <div class="sticky">
      <div class="toolbar">
        <label class="btn primary"><input id="fileInput" type="file" multiple hidden><svg class="i"><use href="#i-upload"/></svg><span data-t="upload"></span></label>
        <label class="btn"><input id="dirInput" type="file" webkitdirectory multiple hidden><svg class="i"><use href="#i-folder-upload"/></svg><span data-t="uploadFolder"></span></label>
        <button id="mkdirBtn" class="btn" type="button"><svg class="i"><use href="#i-new-folder"/></svg><span data-t="newFolder"></span></button>
        <span class="spacer"></span>
        <button id="zipBtn" class="btn" type="button" disabled><svg class="i"><use href="#i-archive"/></svg><span data-t="zip"></span></button>
        <button id="renameBtn" class="btn" type="button" disabled><svg class="i"><use href="#i-edit"/></svg><span data-t="rename"></span></button>
        <button id="deleteBtn" class="btn danger" type="button" disabled hidden><svg class="i"><use href="#i-delete"/></svg><span data-t="delete"></span></button>
      </div>

      <div id="uploads" class="card uploads" hidden>
        <div class="progress"><div id="progressBar"></div></div>
        <div class="uploads-row"><span id="uploadText"></span><button id="cancelBtn" class="btn small" type="button"><svg class="i"><use href="#i-close"/></svg><span data-t="cancel"></span></button></div>
      </div>

      <div class="infobar muted">
        <span id="selCount"></span>
        <span id="summary"></span>
      </div>

      <div class="row head">
        <span class="c-check"><input id="selectAll" type="checkbox"></span>
        <button class="c-name sort" type="button" data-sort="name"></button>
        <button class="c-date sort" type="button" data-sort="date"></button>
        <button class="c-size sort" type="button" data-sort="size"></button>
        <span class="c-act"></span>
      </div>
    </div>

    <div id="drop" class="table">
      <ul id="list"></ul>
      <p id="empty" class="empty" hidden></p>
      <div class="drophint" data-t="dropHint"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<script src="/.yawts/app.js"></script>
</body>
</html>
