# Builds a signed APK and publishes it as a GitHub release on every push to main (or by hand: Actions > Release > Run workflow).
# The version goes up by itself: 1.0.1, 1.0.2, 1.0.3... (the last release's version + 1). Nothing to bump or tag by hand.
# versionCode is the commit count, so every release installs as an update.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64  the release keystore, base64-encoded (base64 -w0 release.jks)
#   SIGNING_STORE_PASSWORD   its password
#   SIGNING_KEY_ALIAS        the key's alias
#   SIGNING_KEY_PASSWORD     the key's password
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

# Two quick pushes would otherwise both pick the same version.
concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the whole history and tags, for the commit count and the last version

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Work out the version
        run: |
          count=$(git rev-list --count HEAD)
          last=$(git tag -l | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$last" ]; then
            version=1.0.1
          else
            version="${last%.*}.$(( ${last##*.} + 1 ))"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$count" >> "$GITHUB_ENV"

      - name: Decode the signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is not set - see the top of this workflow"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: app/build/reports/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="YAWTS-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$VERSION" "$apk" "$apk.sha256" --target "$GITHUB_SHA" \
            --title "YAWTS $VERSION" --generate-notes

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
